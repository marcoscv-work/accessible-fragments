<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Accessible Components for Liferay">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="512" rx="224" fill="url(#sheen)"/>
  <!-- three stacked fragments -->
  <g fill="#ffffff" fill-opacity="0.22">
    <rect x="128" y="232" width="768" height="136" rx="40"/>
    <rect x="128" y="444" width="768" height="136" rx="40"/>
    <rect x="128" y="656" width="768" height="136" rx="40"/>
  </g>
  <!-- the accessible one, highlighted -->
  <rect x="128" y="444" width="768" height="136" rx="40" fill="#ffffff"/>
  <g fill="#1e3a8a">
    <rect x="300" y="492" width="360" height="40" rx="20"/>
    <rect x="700" y="492" width="120" height="40" rx="20" fill="#2563eb"/>
  </g>
  <!-- accessibility figure in a badge -->
  <circle cx="212" cy="512" r="88" fill="#1e3a8a"/>
  <g fill="#ffffff">
    <circle cx="212" cy="464" r="15"/>
    <path d="M166 494c30 10 62 10 92 0l6 16c-11 4-22 7-32 9v20l20 44-16 8-22-44h-4l-22 44-16-8 20-44v-20c-10-2-21-5-32-9z"/>
  </g>
</svg>
